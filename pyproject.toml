[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "complaintlens"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pandas", "numpy", "scikit-learn", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]